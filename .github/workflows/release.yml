name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release
  PROJECT_PATH: BranchWatch/BranchWatch.csproj
  SOLUTION_PATH: BranchWatch.sln

jobs:
  build:
    name: Build Windows Artifacts
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]

    steps:
      - name: Prepare artifact names
        id: names
        run: |
          $ErrorActionPreference = "Stop"

          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must match vMAJOR.MINOR.PATCH, for example v1.1.0. Actual: $tag"
          }

          $version = $tag.Substring(1)
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_VERSION=$version"

          $rid = "${{ matrix.rid }}"
          $artifactStem = "BranchWatch-$rid"
          $artifactDir = Join-Path $env:RUNNER_TEMP "branchwatch-artifacts-$rid"
          New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null

          $exePath = Join-Path $artifactDir "$artifactStem.exe"
          $shaPath = "$exePath.sha256"

          "artifact_stem=$artifactStem" >> $env:GITHUB_OUTPUT
          "artifact_dir=$artifactDir" >> $env:GITHUB_OUTPUT
          "exe_path=$exePath" >> $env:GITHUB_OUTPUT
          "sha_path=$shaPath" >> $env:GITHUB_OUTPUT
          "release_tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test
        if: matrix.rid == 'win-x64'
        run: dotnet test $env:SOLUTION_PATH -c $env:CONFIGURATION

      - name: Publish
        run: |
          $ErrorActionPreference = "Stop"
          $rid = "${{ matrix.rid }}"

          dotnet publish $env:PROJECT_PATH `
            -c $env:CONFIGURATION `
            -r $rid `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:Version=$env:RELEASE_VERSION `
            -p:AssemblyVersion="$env:RELEASE_VERSION.0" `
            -p:FileVersion="$env:RELEASE_VERSION.0" `
            -o "${{ steps.names.outputs.artifact_dir }}"

          $publishedExe = Join-Path "${{ steps.names.outputs.artifact_dir }}" "BranchWatch.exe"
          if (-not (Test-Path -LiteralPath $publishedExe -PathType Leaf)) {
            throw "Expected publish output not found: $publishedExe"
          }

          Move-Item -LiteralPath $publishedExe -Destination "${{ steps.names.outputs.exe_path }}" -Force

      - name: Generate SHA256 checksum
        run: |
          $ErrorActionPreference = "Stop"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath "${{ steps.names.outputs.exe_path }}").Hash.ToLowerInvariant()
          $fileName = Split-Path -Leaf "${{ steps.names.outputs.exe_path }}"
          Set-Content -LiteralPath "${{ steps.names.outputs.sha_path }}" -Value "$hash  $fileName" -Encoding ASCII

      - name: Upload executable artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.names.outputs.artifact_stem }}.exe
          path: ${{ steps.names.outputs.exe_path }}
          if-no-files-found: error
          archive: false

      - name: Upload checksum artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.names.outputs.artifact_stem }}.exe.sha256
          path: ${{ steps.names.outputs.sha_path }}
          if-no-files-found: error
          archive: false

  release:
    name: Attest and Publish Signed Release
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write

    steps:
      - name: Download executable artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true

      - name: Resolve release assets
        id: resolve
        run: |
          $ErrorActionPreference = "Stop"

          $assetDir = Join-Path $env:RUNNER_TEMP "release-assets"
          $rids = @("win-x64", "win-arm64")

          foreach ($rid in $rids) {
            $stem = "BranchWatch-$rid"
            $exeFiles = @(Get-ChildItem -LiteralPath $assetDir -Recurse -File | Where-Object { $_.Name -eq "$stem.exe" })
            $shaFiles = @(Get-ChildItem -LiteralPath $assetDir -Recurse -File | Where-Object { $_.Name -eq "$stem.exe.sha256" })

            if ($exeFiles.Count -ne 1) {
              throw "Expected exactly one executable artifact for $rid, found $($exeFiles.Count)."
            }
            if ($shaFiles.Count -ne 1) {
              throw "Expected exactly one checksum artifact for $rid, found $($shaFiles.Count)."
            }

            $exePath = $exeFiles[0].FullName
            $shaPath = $shaFiles[0].FullName
            $provenancePath = "$exePath.intoto.jsonl"
            $safeRid = $rid.Replace("-", "_")

            "${safeRid}_exe_path=$exePath" >> $env:GITHUB_OUTPUT
            "${safeRid}_sha_path=$shaPath" >> $env:GITHUB_OUTPUT
            "${safeRid}_provenance_path=$provenancePath" >> $env:GITHUB_OUTPUT
          }

      - name: Attest win-x64 executable
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ steps.resolve.outputs.win_x64_exe_path }}

      - name: Attest win-arm64 executable
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ steps.resolve.outputs.win_arm64_exe_path }}

      - name: Export and verify provenance bundles
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WIN_X64_EXE_PATH: ${{ steps.resolve.outputs.win_x64_exe_path }}
          WIN_X64_PROVENANCE_PATH: ${{ steps.resolve.outputs.win_x64_provenance_path }}
          WIN_ARM64_EXE_PATH: ${{ steps.resolve.outputs.win_arm64_exe_path }}
          WIN_ARM64_PROVENANCE_PATH: ${{ steps.resolve.outputs.win_arm64_provenance_path }}
        run: |
          $ErrorActionPreference = "Stop"

          function Export-Provenance {
            param(
              [Parameter(Mandatory = $true)][string]$ExePath,
              [Parameter(Mandatory = $true)][string]$ProvenancePath
            )

            $exportDir = Join-Path $env:RUNNER_TEMP ("attestation-export-" + [Guid]::NewGuid().ToString("N"))
            Remove-Item -LiteralPath $exportDir -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path $exportDir -Force | Out-Null
            Push-Location -LiteralPath $exportDir
            try {
              gh attestation download "$ExePath" `
                -R "$env:GH_REPO" `
                --predicate-type "https://slsa.dev/provenance/v1"

              $bundleFiles = @(Get-ChildItem -LiteralPath $exportDir -File | Where-Object {
                $_.Name -like "sha256-*.jsonl" -or $_.Name -like "sha256:*.jsonl"
              })
              if ($bundleFiles.Count -ne 1) {
                throw "Expected exactly one attestation bundle for '$ExePath', found $($bundleFiles.Count)."
              }

              $bundlePath = $bundleFiles[0].FullName
              if ((Get-Item -LiteralPath $bundlePath).Length -le 0) {
                throw "Attestation bundle '$bundlePath' is empty."
              }

              Copy-Item -LiteralPath $bundlePath -Destination $ProvenancePath -Force
              if (-not (Test-Path -LiteralPath $ProvenancePath -PathType Leaf)) {
                throw "Provenance file was not created at '$ProvenancePath'."
              }
              if ((Get-Item -LiteralPath $ProvenancePath).Length -le 0) {
                throw "Provenance file '$ProvenancePath' is empty."
              }
              if (-not $ProvenancePath.EndsWith(".intoto.jsonl")) {
                throw "Provenance filename must end with .intoto.jsonl."
              }

              gh attestation verify "$ExePath" `
                -R "$env:GH_REPO" `
                --bundle "$ProvenancePath" `
                --predicate-type "https://slsa.dev/provenance/v1" `
                --signer-workflow "$env:GH_REPO/.github/workflows/release.yml" `
                --deny-self-hosted-runners
            }
            finally {
              Pop-Location
              Remove-Item -LiteralPath $exportDir -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

          Export-Provenance -ExePath $env:WIN_X64_EXE_PATH -ProvenancePath $env:WIN_X64_PROVENANCE_PATH
          Export-Provenance -ExePath $env:WIN_ARM64_EXE_PATH -ProvenancePath $env:WIN_ARM64_PROVENANCE_PATH

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          WIN_X64_EXE_PATH: ${{ steps.resolve.outputs.win_x64_exe_path }}
          WIN_X64_SHA_PATH: ${{ steps.resolve.outputs.win_x64_sha_path }}
          WIN_X64_PROVENANCE_PATH: ${{ steps.resolve.outputs.win_x64_provenance_path }}
          WIN_ARM64_EXE_PATH: ${{ steps.resolve.outputs.win_arm64_exe_path }}
          WIN_ARM64_SHA_PATH: ${{ steps.resolve.outputs.win_arm64_sha_path }}
          WIN_ARM64_PROVENANCE_PATH: ${{ steps.resolve.outputs.win_arm64_provenance_path }}
        run: |
          $ErrorActionPreference = "Stop"

          $assetPaths = @(
            $env:WIN_X64_EXE_PATH,
            $env:WIN_X64_SHA_PATH,
            $env:WIN_X64_PROVENANCE_PATH,
            $env:WIN_ARM64_EXE_PATH,
            $env:WIN_ARM64_SHA_PATH,
            $env:WIN_ARM64_PROVENANCE_PATH
          )

          foreach ($path in $assetPaths) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required release asset missing: '$path'."
            }
          }

          gh release create "$env:RELEASE_TAG" `
            --generate-notes `
            --title "$env:RELEASE_TAG" `
            $assetPaths

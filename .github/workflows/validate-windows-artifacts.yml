name: Validate Windows Artifacts

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release
  PROJECT_PATH: BranchWatch/BranchWatch.csproj
  SOLUTION_PATH: BranchWatch.sln

jobs:
  test:
    name: Test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test $env:SOLUTION_PATH -c $env:CONFIGURATION -warnaserror

      - name: Build Desktop Memory fixture
        run: dotnet build tools/DesktopMemoryFixture/DesktopMemoryFixture.csproj -c $env:CONFIGURATION

      - name: Build and test browser correlation probe
        run: dotnet run --project tools/BrowserCorrelationProbe/BrowserCorrelationProbe.csproj -c $env:CONFIGURATION -- --self-test

      - name: Build browser companion native host
        run: dotnet build tools/BrowserCompanionHost/BrowserCompanionHost.csproj -c $env:CONFIGURATION

      - name: Build and test Firefox companion diagnostic
        run: dotnet run --project tools/FirefoxCompanionHost/FirefoxCompanionHost.csproj -c $env:CONFIGURATION -- --self-test

      - name: Validate browser probe installer syntax
        run: |
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/browser-correlation-probe.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/browser-companion.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/firefox-companion.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          node --check tools/firefox-companion-extension/popup.js
          if ($LASTEXITCODE -ne 0) { throw 'Firefox popup syntax check failed.' }
          node --check tools/firefox-companion-extension/challenge.js
          if ($LASTEXITCODE -ne 0) { throw 'Firefox challenge syntax check failed.' }
          node --check tools/browser-companion-extension/worker.js
          if ($LASTEXITCODE -ne 0) { throw 'Worker syntax check failed.' }
          node --check tools/browser-companion-extension/popup.js
          if ($LASTEXITCODE -ne 0) { throw 'Popup syntax check failed.' }

      - name: Test browser reopening behavior
        run: node --test tools/browser-companion-tests/restore.test.cjs tools/browser-companion-tests/capture.test.cjs

      - name: Test Firefox Companion diagnostic behavior
        run: node --test tools/browser-companion-tests/firefox.test.cjs tools/browser-companion-tests/firefox-challenge.test.cjs tools/browser-companion-tests/firefox-session-plan.test.cjs tools/browser-companion-tests/firefox-qualification.test.cjs

      - name: Test Desktop Memory evidence checks
        run: ./scripts/desktop-memory-qualification.ps1 -Action SelfTest

      - name: Test memory profiling harness
        run: ./scripts/memory-profile.ps1 -Action SelfTest

  package:
    name: Package ${{ matrix.rid }}
    runs-on: windows-latest
    needs: test

    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: |
          $rid = "${{ matrix.rid }}"
          $publishDir = Join-Path $env:RUNNER_TEMP "branchwatch-publish-$rid"

          dotnet publish $env:PROJECT_PATH `
            -c $env:CONFIGURATION `
            -r $rid `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o $publishDir

          $exePath = Join-Path $publishDir "BranchWatch.exe"
          if (-not (Test-Path $exePath)) {
            throw "Expected publish output not found: $exePath"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: BranchWatch-${{ matrix.rid }}
          path: ${{ runner.temp }}/branchwatch-publish-${{ matrix.rid }}
          if-no-files-found: error
          retention-days: 14
